# Pre-commit hooks mirroring the CI lint job (.github/workflows/ci.yml).
# Keep the ruff rev in step with requirements-dev.txt, which CI reads; Dependabot updates both.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        name: ruff check
        args: ["--config", "custom_components/andersen_ev/ruff.toml"]
        files: ^custom_components/andersen_ev/.*\.py$
      - id: ruff-format
        name: ruff format
        args: ["--config", "custom_components/andersen_ev/ruff.toml"]
        files: ^custom_components/andersen_ev/.*\.py$
