  start_min: Int
  stop_hour: Int
  stop_min: Int
  dailyenable: Boolean
}

type DeviceChargeLogTotal {
  deviceId: String
  chargeEnergyTotal: Float
  solarEnergyTotal: Float
  gridEnergyTotal: Float
  durationTotal: Int
  start: Date
}

"""Device charge logs"""
type DeviceChargeLog {
  deviceId: String!

  """
  32 Bytes UUID for this charge session 24 chars core id, 8 chars unix localtime in hex
  """
  uuid: ID!

  """Local time of charge start (2019-12-31T20:16:50Z)"""
  start: String

  """Running duration of charge (seconds)"""
  duration: Int

  """Charge energy supplied to vehicle since start (watt/hours)"""
  chargeEnergyTotal: Float

  """Solar energy supplied since start (watt/hours)"""
  solarEnergyTotal: Float

  """Grid energy used since last event (watt/hours)"""
  gridEnergyTotal: Float

  """Max power supplied to vehicle (watts)"""
  chargePowerMax: Float

  """Charge log seqs (unparsed)"""
  seqs: String

  """Charge log seqs (parsed)"""
  seqList: [DeviceChargeLogSeq]

  """Deprecated"""
  chargePower: Float
}

type DeviceChargeLogSeq {
  """Event sequence 0-(2^32-1)"""
  seq: Int

  """Charge energy supplied to vehicle since last event (watt/hours)"""
  chargeEnergy: Float

  """Solar energy supplied since last event (watt/hours)"""
  solarEnergy: Float

  """Grid energy used since last event (watt/hours)"""
  gridEnergy: Float

  """Charge energy supplied to vehicle since start of charge (kwH)"""
  chargeEnergyTotal: Float

  """Solar energy supplied since start of charge (kWh)"""
  solarEnergyTotal: Float

  """Grid energy used since start of charge  (kwH)"""
  gridEnergyTotal: Float

  """Max power supplied to vehicle (watts)"""
  chargePowerMax: Float
  timestamp: Date
}
