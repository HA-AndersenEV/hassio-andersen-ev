  createChargeRate(deviceId: ID!, startDateTime: Date, stopDateTime: Date, dayMon: Boolean, dayTue: Boolean, dayWed: Boolean, dayThu: Boolean, dayFri: Boolean, daySat: Boolean, daySun: Boolean, timeStartLocal: String, timeStopLocal: String, price: Float!, currencyId: String): ChargeRate
  updateChargeRate(id: ID!, deviceId: String, currencyId: String, startDateTime: Date, stopDateTime: Date, dayMon: Boolean, dayTue: Boolean, dayWed: Boolean, dayThu: Boolean, dayFri: Boolean, daySat: Boolean, daySun: Boolean, timeStartLocal: String, timeStopLocal: String, price: Float!): Int
  deleteChargeRate(id: ID!, deviceId: String): Int
  updateCalculatedChargeSeqs(deviceId: ID!, dateFrom: Date, dateTo: Date): Int
  updateCalculatedPowerLogs(deviceId: ID!, dateFrom: Date, dateTo: Date): Int
  upsertAccount(firstName: String, lastName: String, phone: String, shippingAddress1: String, shippingAddress2: String, shippingCity: String, shippingState: String, shippingPostcode: String, shippingCountry: String, agileKey: String, smartTariffAccount: String): String
  unclaimDevice(deviceId: ID!): Boolean
  unclaimDeviceForCustomer(deviceId: ID!, customerEmail: String!): Boolean
  removeShare(customerId: ID!, deviceId: ID!): Boolean
  editDeviceShare(customerId: ID!, deviceId: ID!, newRole: UserRole!): Boolean

  """Sends request to 'Share' a device"""
  requestToShareDevice(email: String!, role: UserRole!, deviceId: ID!): Boolean!
  acceptDeviceShare(code: String!): Boolean!
  chargeNow(deviceId: ID!, timeToCharge: Int!, gridSupplementInWatts: Int): CallFunctionResponse
  setOfflinePercentageThreshold(percentageThreshold: Int!): Boolean!
  removeAllShares(id: ID!): Boolean
  removeDevicesSharedWithUser(customerId: String!): Boolean
  setLatestAppUpdates(latestUpdates: AppUpdatesInput!): Boolean
  setChargerPreferences(serialNumber: String!, front: String, side: String, colours2024: Boolean): Boolean

  """
  Particle → AWS migration control plane (execution runs in-process with GraphQL)
  """
  createMigrationBatch(input: CreateMigrationBatchInput!): MigrationBatch!
  startMigrationBatch(id: ID!): MigrationBatch!
  pauseMigrationBatch(id: ID!): MigrationBatch!
  resumeMigrationBatch(id: ID!): MigrationBatch!
  continueMigrationDevice(batchId: ID!, deviceId: ID!): MigrationBatch!
  retryMigrationDevice(batchId: ID!, deviceId: ID!, fromBeginning: Boolean): MigrationBatch!
  skipMigrationDevice(batchId: ID!, deviceId: ID!): MigrationBatch!

  """
  Mark a device as failed immediately (e.g. known-offline hanging on a long OTA timeout).
  Cancels an in-flight step on the next poll; optional reason is stored on the device.
  """
  failMigrationDevice(batchId: ID!, deviceId: ID!, reason: String): MigrationBatch!
  removeMigrationDevice(batchId: ID!, deviceId: ID!): MigrationBatch!
  updateMigrationBatchSettings(id: ID!, notifyEmail: String, soundEnabled: Boolean, operatorNotes: String): MigrationBatch!

  """
  Preview or write lifetimeEnergyDelivered (Wh) for a device.
  proposed = max(BigQuery session sum, Redis, device sysLifetimeEnergy).
  confirm=false (default): preview only. confirm=true: monotonic Redis write.
  """
  recalculateLifetimeEnergy(deviceId: ID!, confirm: Boolean): RecalculateLifetimeEnergyResult!
}

"""Response from particle call function endpoint"""
type CallFunctionResponse {
  """Device ID"""
  id: String

  """Device name"""
  name: String

  """Name of last app flashed"""
  last_app: String

  """Indicates if the device is currently connected to the cloud"""
  connected: Boolean

  """Return value from the called function"""
  return_value: Int
}

