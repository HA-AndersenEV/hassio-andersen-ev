[tool.pytest.ini_options]
pythonpath = ["custom_components"]
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
    "custom_components/andersen_ev/tests/*",
]

[tool.coverage.report]
omit = [
    "custom_components/andersen_ev/tests/*",
]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true

[tool.pylint.main]
init-hook = "import sys; sys.path.insert(0, 'custom_components')"

[tool.pylint.format]
max-line-length = 120
