name: CI

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version comes from requirements-dev.txt, which Dependabot keeps up to date.
      - name: Install ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: requirements-dev.txt
          args: --version
      - name: Check with ruff
        run: ruff check --config custom_components/andersen_ev/ruff.toml custom_components/andersen_ev
      - name: Check formatting with ruff
        run: ruff format --check --config custom_components/andersen_ev/ruff.toml custom_components/andersen_ev

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Create venv
        run: uv venv
      - name: Install dependencies
        run: uv pip install -r requirements-dev.txt
      - name: Test with pytest
        run: uv run pytest --cov=custom_components/andersen_ev --cov-report=term-missing --cov-report=xml --cov-fail-under=95

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master @ f4ca6f6 (2026-06-22)

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Create venv
        run: uv venv
      - name: Install dependencies
        run: uv pip install -r requirements-dev.txt
      - name: Run mypy
        run: uv run mypy custom_components/andersen_ev

  ci-success:
    name: CI Success
    # Stable required-status-check target: its name never changes when the
    # test matrix changes, so branch protection can require this one context.
    if: ${{ always() }}
    needs: [lint, test, hassfest, hacs, typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.hassfest.result }}" != "success" ] || [ "${{ needs.hacs.result }}" != "success" ] || [ "${{ needs.typecheck.result }}" != "success" ]; then
            echo "A required job did not succeed (lint=${{ needs.lint.result }}, test=${{ needs.test.result }}, hassfest=${{ needs.hassfest.result }}, hacs=${{ needs.hacs.result }}, typecheck=${{ needs.typecheck.result }})"
            exit 1
          fi
          echo "All required jobs succeeded"
